[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudeyoubot"
version = "0.1.0"
description = "A bot that researches trends, writes, voices and packages YouTube videos, then uploads them to Google Drive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
tts = [
    "elevenlabs>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
claudeyoubot = "claudeyoubot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
